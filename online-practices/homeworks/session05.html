<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>
    <link rel="stylesheet" href="./session05.css">
</head>

<body>

    <header class="header">
        <h1>Our Products</h1>
        <p>Find something you love!</p>
    </header>

    <main class="products">

        <div class="product-card">
            <span class="discount">-20%</span>
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600" alt="Headphones">
            <h2>Wireless Headphones</h2>
            <p>Enjoy your favorite music with amazing sound quality.</p>
            <span class="price">$79.99</span>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600" alt="Watch">
            <h2>Classic Watch</h2>
            <p>A simple and elegant watch for everyday use.</p>
            <span class="price">$49.99</span>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <span class="discount">New</span>
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" alt="Shoes">
            <h2>Sport Sneakers</h2>
            <p>Comfortable sneakers for your daily activities.</p>
            <span class="price">$89.99</span>
            <button>Add to Cart</button>
        </div>

    </main>

</body>

</html>
